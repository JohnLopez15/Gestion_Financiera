<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Iniciar sesión · Gestión Financiera</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="auth">
    <div class="auth-card">
        <span class="brand-mark"><i class="bi bi-wallet2"></i></span>
        <h1>Gestión Financiera</h1>
        <p class="page-subtitle">Inicia sesión para ver tu flujo de caja</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                {% if category == 'danger' %}
                <div class="callout risk auth-error" role="alert" style="text-align: left">
                    <i class="bi bi-exclamation-triangle-fill"></i><span>{{ message }}</span>
                </div>
                {% else %}
                <div class="callout auth-error" style="text-align: left; background: var(--accent-soft)">
                    <i class="bi bi-info-circle-fill" style="color: var(--accent)"></i><span>{{ message }}</span>
                </div>
                {% endif %}
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST">
            <div class="group">
                <div class="row stacked">
                    <label class="sr-only" for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
                </div>
                <div class="row stacked">
                    <label class="sr-only" for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
                    <button type="button" class="icon-btn" id="togglePassword" aria-label="Mostrar contraseña" aria-pressed="false">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-block">Iniciar sesión</button>
        </form>

        <p class="auth-foot"><i class="bi bi-lock-fill"></i> Acceso privado</p>
    </div>
</main>
<script>
    document.getElementById('togglePassword').addEventListener('click', function () {
        const pwd = document.getElementById('password');
        const icon = document.getElementById('toggleIcon');
        const show = pwd.type === 'password';
        pwd.type = show ? 'text' : 'password';
        icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
        this.setAttribute('aria-pressed', show);
        this.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
</script>
</body>
</html>
